
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolso de Vestir 3D</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
  color: #614b69;
  background: #fff0f7;
}

header {
  padding: 22px 12px 10px;
}

h1 {
  color: #d45e9c;
  margin: 0 0 8px;
  font-size: 29px;
}

p {
  margin: 8px;
}

.contenedor {
  width: min(950px, 94%);
  margin: 15px auto 30px;
  padding: 18px;
  background: white;
  border-radius: 24px;
  box-shadow: 0 8px 25px #d9a9c755;
}

canvas {
  display: block;
  width: 100%;
  height: 440px;
  border-radius: 18px;
  background: linear-gradient(#fff8fd, #eee1ff);
  touch-action: none;
}

.controles {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
  padding: 22px 8px 12px;
}

.control {
  padding: 16px;
  background: #fff0f8;
  border-radius: 16px;
  text-align: left;
}

.control label {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-weight: bold;
  margin-bottom: 12px;
}

input[type="range"] {
  width: 100%;
  accent-color: #dc71ae;
  cursor: pointer;
}

button {
  border: none;
  border-radius: 14px;
  padding: 12px 22px;
  background: #dc71ae;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #c65394;
}

.nota {
  color: #8b7490;
  font-size: 13px;
  margin-top: 16px;
}

@media (max-width: 560px) {
  .controles {
    grid-template-columns: 1fr;
  }

  canvas {
    height: 350px;
  }
}
</style>
</head>

<body>

<header>
  <h1>👜 Mi Bolso de Moda 🎀</h1>
  <p>¡Diseña un bolso elegante y dale tu propio estilo!</p>
</header>

<main class="contenedor">

  <canvas id="lienzo"></canvas>

  <section class="controles">

    <div class="control">
      <label for="ancho">
        <span>📏 Ancho del bolso</span>
        <span id="valorAncho">2.0</span>
      </label>

      <input
        id="ancho"
        type="range"
        min="1.5"
        max="2.8"
        step="0.1"
        value="2.0">
    </div>

    <div class="control">
      <label for="redondez">
        <span>💗 Redondez de esquinas</span>
        <span id="valorRedondez">0.25</span>
      </label>

      <input
        id="redondez"
        type="range"
        min="0.05"
        max="0.45"
        step="0.05"
        value="0.25">
    </div>

  </section>

  <button id="reiniciar">✨ Reiniciar diseño</button>

  <p class="nota">
    Arrastra para girar el bolso y utiliza la rueda del ratón
    para acercarte o alejarte.
  </p>

</main>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from
  "three/addons/controls/OrbitControls.js";

// ==========================================
// CONFIGURACIÓN DE LA ESCENA 3D
// ==========================================

const canvas = document.getElementById("lienzo");
const escena = new THREE.Scene();

escena.background = new THREE.Color("#f4eaff");

// MATRICES DE TRANSFORMACIÓN:
// La cámara tiene una posición y una orientación en el espacio 3D.
// Three.js calcula automáticamente su matriz de vista,
// que determina cómo se observa la escena.

// PROYECCIÓN:
// PerspectiveCamera define una proyección en perspectiva.
// Parámetros: campo de visión, relación de aspecto inicial,
// plano cercano y plano lejano.
const camara = new THREE.PerspectiveCamera(
  40, 1, 0.1, 100
);

// MATRIZ DE TRANSFORMACIÓN:
// position.set establece la posición de la cámara.
camara.position.set(3.5, 2.8, 6);

const renderizador = new THREE.WebGLRenderer({
  canvas: canvas,
  antialias: true
});

renderizador.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderizador.shadowMap.enabled = true;
renderizador.shadowMap.type = THREE.PCFSoftShadowMap;
renderizador.outputColorSpace = THREE.SRGBColorSpace;
renderizador.toneMapping = THREE.ACESFilmicToneMapping;
renderizador.toneMappingExposure = 1.2;

// ==========================================
// CONTROLES DE CÁMARA
// ==========================================

const controles = new OrbitControls(camara, canvas);

controles.enableDamping = true;
controles.target.set(0, 1.25, 0);
controles.minDistance = 3;
controles.maxDistance = 9;
controles.maxPolarAngle = Math.PI * 0.49;

// MATRICES DE TRANSFORMACIÓN:
// OrbitControls permite cambiar la orientación de la cámara
// al arrastrar el ratón. Three.js actualiza las matrices
// necesarias para mostrar el bolso desde distintos ángulos.

// ==========================================
// ILUMINACIÓN
// ==========================================

escena.add(
  new THREE.HemisphereLight(0xffffff, 0xd6b6dc, 2.2)
);

const luz = new THREE.DirectionalLight(0xffffff, 3);
luz.position.set(3, 6, 5);
luz.castShadow = true;
escena.add(luz);

const luzRelleno = new THREE.DirectionalLight(
  0xffc9e8, 1.5
);
luzRelleno.position.set(-4, 3, -3);
escena.add(luzRelleno);

// ==========================================
// MATERIALES
// ==========================================

const materialBolso = new THREE.MeshStandardMaterial({
  color: "#ee91bd",
  roughness: 0.38,
  metalness: 0.02
});

const materialBorde = new THREE.MeshStandardMaterial({
  color: "#d96fa6",
  roughness: 0.48
});

const materialAsa = new THREE.MeshStandardMaterial({
  color: "#f6b6d5",
  roughness: 0.4
});

const materialDorado = new THREE.MeshStandardMaterial({
  color: "#ffd66e",
  metalness: 0.35,
  roughness: 0.3
});

const materialInterior = new THREE.MeshStandardMaterial({
  color: "#b995ed",
  roughness: 0.6
});

// Grupo que contiene las piezas del bolso.
const bolso = new THREE.Group();
escena.add(bolso);

// MATRICES DE TRANSFORMACIÓN:
// Cada pieza añadida al grupo tiene sus propias transformaciones.
// El grupo permite transformar conjuntamente todas sus piezas.

// ==========================================
// PARÁMETROS MODIFICABLES
// ==========================================

let ancho = 2.0;
let redondez = 0.25;

const alto = 1.65;
const profundidad = 0.52;

// ==========================================
// FORMA CON ESQUINAS REDONDEADAS
// ==========================================

function crearFormaRedondeada(w, h, r) {
  const forma = new THREE.Shape();

  const x = -w / 2;
  const y = 0;

  r = Math.max(
    0.001,
    Math.min(r, w / 2 - 0.001, h / 2 - 0.001)
  );

  forma.moveTo(x + r, y);
  forma.lineTo(x + w - r, y);
  forma.quadraticCurveTo(x + w, y, x + w, y + r);

  forma.lineTo(x + w, y + h - r);
  forma.quadraticCurveTo(
    x + w, y + h, x + w - r, y + h
  );

  forma.lineTo(x + r, y + h);
  forma.quadraticCurveTo(x, y + h, x, y + h - r);

  forma.lineTo(x, y + r);
  forma.quadraticCurveTo(x, y, x + r, y);

  return forma;
}

// ==========================================
// GEOMETRÍA Y TRANSFORMACIONES
// ==========================================

function crearPieza(w, h, r, d, material, y, z) {
  const forma = crearFormaRedondeada(w, h, r);

  // GEOMETRÍA 3D:
  // ExtrudeGeometry convierte el contorno 2D en un sólido
  // añadiéndole profundidad en el eje Z.
  const geometria = new THREE.ExtrudeGeometry(forma, {
    depth: d,
    bevelEnabled: true,
    bevelSegments: 3,
    steps: 1,
    bevelSize: 0.035,
    bevelThickness: 0.035,
    curveSegments: 12
  });

  const malla = new THREE.Mesh(geometria, material);

  // MATRIZ DE TRANSFORMACIÓN:
  // position define la traslación de esta pieza en el espacio.
  // Three.js combina la traslación con la rotación y la escala
  // para calcular su matriz de transformación del modelo.
  malla.position.set(0, y, z);

  malla.castShadow = true;
  malla.receiveShadow = true;

  bolso.add(malla);

  return malla;
}

// ==========================================
// ASA CURVA DEL BOLSO
// ==========================================

function crearAsa() {
  const puntos = [];

  const w = ancho * 0.36;
  const baseY = alto + 0.02;
  const alturaAsa = 0.88;

  // CURVA DE BÉZIER CÚBICA:
  // Los puntos de control definen la forma del asa.
  const curva = new THREE.CubicBezierCurve3(
    new THREE.Vector3(-w, baseY, 0),
    new THREE.Vector3(-w * 1.15, baseY + alturaAsa, 0),
    new THREE.Vector3(w * 1.15, baseY + alturaAsa, 0),
    new THREE.Vector3(w, baseY, 0)
  );

  puntos.push(...curva.getPoints(48));

  const trayectoria = new THREE.CatmullRomCurve3(puntos);

  const geometria = new THREE.TubeGeometry(
    trayectoria,
    64,
    0.065,
    12,
    false
  );

  const asa = new THREE.Mesh(geometria, materialAsa);

  // MATRIZ DE TRANSFORMACIÓN:
  // El asa pertenece al grupo del bolso y puede heredar
  // las transformaciones que se apliquen a dicho grupo.
  asa.castShadow = true;
  bolso.add(asa);

  // Uniones decorativas del asa.
  for (const lado of [-1, 1]) {
    const union = new THREE.Mesh(
      new THREE.SphereGeometry(0.095, 24, 20),
      materialDorado
    );

    // MATRIZ DE TRANSFORMACIÓN:
    // Coloca cada unión en un extremo del asa.
    union.position.set(lado * w, baseY, 0);

    union.castShadow = true;
    bolso.add(union);
  }
}

// ==========================================
// BROCHE DECORATIVO
// ==========================================

function crearBroche() {
  const broche = new THREE.Mesh(
    new THREE.SphereGeometry(0.12, 32, 24),
    materialDorado
  );

  // MATRICES DE TRANSFORMACIÓN:
  // position traslada el broche y scale modifica su tamaño
  // en cada eje para conseguir una forma ovalada.
  broche.position.set(
    0, alto * 0.55, profundidad + 0.075
  );

  broche.scale.set(1, 1.1, 0.45);
  broche.castShadow = true;

  bolso.add(broche);

  const centro = new THREE.Mesh(
    new THREE.SphereGeometry(0.055, 24, 20),
    new THREE.MeshStandardMaterial({
      color: "#fff0a5",
      roughness: 0.35
    })
  );

  // MATRIZ DE TRANSFORMACIÓN:
  // El centro se traslada y se escala para encajar
  // visualmente sobre el broche.
  centro.position.set(
    0, alto * 0.55, profundidad + 0.125
  );

  centro.scale.set(1, 1, 0.5);
  bolso.add(centro);
}

// ==========================================
// FLOR DECORATIVA
// ==========================================

function crearFlor() {
  const flor = new THREE.Group();

  const materialPetalo = new THREE.MeshStandardMaterial({
    color: "#fff0a8",
    roughness: 0.45
  });

  for (let i = 0; i < 5; i++) {
    const angulo = i * Math.PI * 2 / 5;

    const petalo = new THREE.Mesh(
      new THREE.SphereGeometry(0.075, 20, 16),
      materialPetalo
    );

    // MATRIZ DE TRANSFORMACIÓN:
    // Cada pétalo se traslada y se escala para formar la flor.
    petalo.position.set(
      Math.cos(angulo) * 0.09,
      Math.sin(angulo) * 0.09,
      0
    );

    petalo.scale.set(1, 0.85, 0.45);
    flor.add(petalo);
  }

  const centro = new THREE.Mesh(
    new THREE.SphereGeometry(0.05, 20, 16),
    materialDorado
  );

  centro.position.z = 0.025;
  flor.add(centro);

  // MATRIZ DE TRANSFORMACIÓN:
  // Sitúa la flor sobre la superficie frontal del bolso.
  flor.position.set(
    -ancho * 0.27,
    alto * 0.53,
    profundidad + 0.07
  );

  bolso.add(flor);
}

// ==========================================
// DETALLES DEL BOLSO
// ==========================================

function crearDetalles() {
  const borde = new THREE.Mesh(
    new THREE.BoxGeometry(ancho * 0.88, 0.055, 0.055),
    materialBorde
  );

  // MATRIZ DE TRANSFORMACIÓN:
  // Traslada el borde a la parte superior del bolso.
  borde.position.set(
    0, alto - 0.12, profundidad + 0.015
  );

  borde.castShadow = true;
  bolso.add(borde);

  // Puntos decorativos a ambos lados.
  for (const lado of [-1, 1]) {
    for (let i = 0; i < 4; i++) {
      const punto = new THREE.Mesh(
        new THREE.SphereGeometry(0.025, 12, 12),
        materialDorado
      );

      // MATRIZ DE TRANSFORMACIÓN:
      // Cada punto se coloca en una coordenada específica.
      punto.position.set(
        lado * ancho * 0.39,
        0.3 + i * 0.22,
        profundidad + 0.025
      );

      bolso.add(punto);
    }
  }
}

// ==========================================
// CONSTRUCCIÓN Y ACTUALIZACIÓN DEL MODELO
// ==========================================

function construirBolso() {
  // Elimina las piezas anteriores para reconstruir el modelo.
  while (bolso.children.length > 0) {
    const objeto = bolso.children[0];

    bolso.remove(objeto);

    // Libera la geometría de cada objeto eliminado.
    objeto.traverse(hijo => {
      if (hijo.geometry) {
        hijo.geometry.dispose();
      }
    });
  }

  // Cuerpo principal del bolso.
  crearPieza(
    ancho,
    alto,
    redondez,
    profundidad,
    materialBolso,
    0.15,
    -profundidad / 2
  );

  // Solapa frontal.
  crearPieza(
    ancho * 0.78,
    alto * 0.30,
    Math.min(redondez, 0.18),
    0.055,
    materialInterior,
    alto * 0.49,
    profundidad / 2 - 0.01
  );

  crearBroche();
  crearAsa();
  crearDetalles();
  crearFlor();

  // MATRICES DE TRANSFORMACIÓN:
  // Al reconstruir las piezas con los nuevos parámetros,
  // cambia la geometría y la ubicación relativa de los detalles.
}

// ==========================================
// SLIDERS: PARÁMETROS MODIFICABLES
// ==========================================

const controlAncho = document.getElementById("ancho");
const controlRedondez = document.getElementById("redondez");

controlAncho.addEventListener("input", () => {
  ancho = Number(controlAncho.value);

  document.getElementById("valorAncho").textContent =
    ancho.toFixed(1);

  construirBolso();
});

controlRedondez.addEventListener("input", () => {
  redondez = Number(controlRedondez.value);

  document.getElementById("valorRedondez").textContent =
    redondez.toFixed(2);

  construirBolso();
});

// ==========================================
// REINICIAR DISEÑO
// ==========================================

document.getElementById("reiniciar").addEventListener("click", () => {
  ancho = 2.0;
  redondez = 0.25;

  controlAncho.value = ancho;
  controlRedondez.value = redondez;

  document.getElementById("valorAncho").textContent =
    ancho.toFixed(1);

  document.getElementById("valorRedondez").textContent =
    redondez.toFixed(2);

  construirBolso();

  // MATRICES DE TRANSFORMACIÓN:
  // Restablece la posición de la cámara para volver
  // a la vista inicial del modelo.
  camara.position.set(3.5, 2.8, 6);
  controles.target.set(0, 1.25, 0);
  controles.update();
});

// ==========================================
// SUELO
// ==========================================

const suelo = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({
    color: "#f4eaff",
    roughness: 0.9
  })
);

// MATRIZ DE TRANSFORMACIÓN:
// La rotación inclina el plano 90 grados para colocarlo
// horizontalmente debajo del bolso.
suelo.rotation.x = -Math.PI / 2;

// MATRIZ DE TRANSFORMACIÓN:
// Traslada el suelo a la altura indicada.
suelo.position.y = 0.10;
suelo.receiveShadow = true;
escena.add(suelo);

// ==========================================
// AJUSTE DEL CANVAS Y MATRIZ DE PROYECCIÓN
// ==========================================

function ajustarPantalla() {
  const anchoCanvas = canvas.clientWidth;
  const altoCanvas = canvas.clientHeight;

  renderizador.setSize(
    anchoCanvas,
    altoCanvas,
    false
  );

  // MATRIZ DE PROYECCIÓN:
  // La relación entre el ancho y el alto del canvas determina
  // la proporción de la imagen proyectada.
  camara.aspect = anchoCanvas / altoCanvas;

  // MATRIZ DE PROYECCIÓN:
  // Actualiza la matriz de proyección de la cámara después
  // de cambiar la relación de aspecto.
  // Esta matriz convierte el espacio de la cámara en una
  // proyección en perspectiva sobre la pantalla.
  camara.updateProjectionMatrix();
}

const observador = new ResizeObserver(ajustarPantalla);
observador.observe(canvas);
ajustarPantalla();

// ==========================================
// RENDERIZADO Y PROYECCIÓN FINAL
// ==========================================

construirBolso();

function animar() {
  requestAnimationFrame(animar);

  controles.update();

  // MATRICES DE TRANSFORMACIÓN:
  // Three.js actualiza las matrices de los objetos y la cámara
  // para conocer su posición y orientación en la escena.

  // MATRIZ DE VISTA:
  // Determina cómo se observa la escena desde la cámara.

  // MATRIZ DE PROYECCIÓN:
  // Proyecta la escena 3D en el plano de imagen 2D.

  // RENDERIZADO:
  // Combina geometría, materiales, iluminación, transformaciones
  // y proyección para dibujar el bolso en el canvas.
  renderizador.render(escena, camara);
}

animar();

</script>

</body>
</html>
